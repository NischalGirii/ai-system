[project]
name = "rag-voice-to-voice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NischalGirii", email = "NischalGirii@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.4",
    "pymupdf>=1.28.2",
    "pypdf>=6.15.0",
    "sentence-transformers>=5.7.0",
]

[project.scripts]
rag-voice-to-voice = "rag_voice_to_voice:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
